openapi: 3.1.0

info:
  title: Image Hosting Service API
  version: 1.0.0
  description: |
    REST API for uploading, managing, searching, and securely sharing images.

    Uploaded images are private by default. Original files and thumbnails are
    stored in a private Cloudflare R2 bucket and delivered through protected API
    endpoints. Gemini analyzes images asynchronously and generates searchable
    objects, tags, and colors.

    Authentication uses an opaque database-backed SESSION cookie. Authenticated
    state-changing requests also require the X-CSRF-TOKEN header.
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Registration, login, logout, password reset, and session operations
  - name: Images
    description: Image upload, management, gallery, search, and content
  - name: Sharing
    description: Temporary private-image sharing links

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: Creates an account, starts a session, and returns the authenticated user.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and authenticated
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailConflict"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates the user and starts a database-backed session.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Invalidates the current session and clears the session cookie.
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session invalidated
          headers:
            Set-Cookie:
              description: Expired session cookie
              schema:
                type: string
                example: SESSION=; Path=/; HttpOnly; Max-Age=0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/csrf:
    get:
      tags:
        - Authentication
      summary: Get a CSRF token
      description: Returns the token required for authenticated state-changing requests.
      operationId: getCsrfToken
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password-reset/request:
    post:
      tags:
        - Authentication
      summary: Request a password reset
      description: |
        Accepts an email address and always returns the same empty response so
        callers cannot determine whether the address is registered.

        When the address belongs to a user, all older unused reset tokens for
        that user are invalidated and a new single-use token is created. The
        token expires after 30 minutes.

        Password reset is currently enabled only outside the `prod` profile.
        The development implementation writes the reset link to the application
        log. A production email sender is not implemented yet.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Request accepted, whether or not the email is registered
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/password-reset/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm a password reset
      description: |
        Replaces the user's password when supplied with a valid, unexpired,
        unused reset token. A successful reset consumes the token and
        invalidates all existing sessions for the user. The user must log in
        again with the new password.

        Password reset is currently enabled only outside the `prod` profile.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password updated, token consumed, and sessions invalidated
        "400":
          $ref: "#/components/responses/InvalidPasswordResetToken"

  /images:
    post:
      tags:
        - Images
      summary: Upload an image
      description: |
        Uploads a JPEG, PNG, or WebP image up to 10 MB.

        Every uploaded image is private by default. Thumbnail generation is
        completed during upload, and Gemini analysis continues asynchronously.

        The response contains image metadata and relative thumbnail and content
        URLs. It does not contain image bytes.
      operationId: uploadImage
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image up to 10 MB
      responses:
        "201":
          description: Image uploaded as private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImageType"

    get:
      tags:
        - Images
      summary: Browse or search public images
      description: |
        Returns public images from newest to oldest.

        Each item uses ImageResponse and contains image metadata plus relative
        thumbnail and content URLs. The response does not contain image bytes.

        Gallery and search clients should display thumbnailUrl. They should
        request contentUrl only after the user explicitly opens the full image.

        When `q` is supplied, the query searches AI-generated objects, tags,
        and colors using case-insensitive partial matching. All supplied
        filters are combined with AND. Private images are never included.
      operationId: getPublicImages
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/ContentTypeFilter"
        - $ref: "#/components/parameters/ColorFilter"
        - $ref: "#/components/parameters/TaggingStatusFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Page of public image metadata with thumbnail and content URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /images/mine:
    get:
      tags:
        - Images
      summary: List owned images
      description: |
        Returns public and private images owned by the authenticated user from
        newest to oldest.

        Each item uses ImageResponse and contains image metadata plus relative
        thumbnail and content URLs. The response does not contain image bytes.

        Clients should display thumbnailUrl in the image library and request
        contentUrl only after the user explicitly opens the full image.

        Search is limited to the authenticated user's images. All supplied
        filters are combined with AND.
      operationId: getMyImages
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/ContentTypeFilter"
        - $ref: "#/components/parameters/ColorFilter"
        - $ref: "#/components/parameters/TaggingStatusFilter"
        - $ref: "#/components/parameters/VisibilityFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Page of owned image metadata with thumbnail and content URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"

    get:
      tags:
        - Images
      summary: Get image metadata
      description: |
        Returns metadata and relative content and thumbnail URLs for an
        accessible image. This response does not contain image bytes.

        Public images are available to everyone. Private images are available
        only to their owner. An inaccessible private image is reported as not
        found.
      operationId: getImage
      security:
        - {}
        - sessionCookie: []
      responses:
        "200":
          description: Accessible image metadata with thumbnail and content URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "404":
          $ref: "#/components/responses/ImageNotFound"

    patch:
      tags:
        - Images
      summary: Change image visibility
      description: |
        Makes an owned image public or private.

        Only the image owner can change its visibility. The response contains
        updated image metadata and relative image URLs.
      operationId: updateImageVisibility
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImageVisibilityRequest"
      responses:
        "200":
          description: Visibility updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ImageNotFound"

    delete:
      tags:
        - Images
      summary: Delete an image
      description: |
        Permanently deletes an owned image, including its database record,
        original object, thumbnail, and sharing links.
      operationId: deleteImage
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Image deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ImageNotFound"

  /images/{imageId}/content:
    get:
      tags:
        - Images
      summary: Stream the original image
      description: |
        Returns the original full-size image bytes.

        Clients should request this endpoint only after the user explicitly
        chooses to view the full image. Galleries, search results, and image
        libraries should use the thumbnail endpoint instead.

        Public images are available to everyone. Private images are available
        only to their owner.
      operationId: getImageContent
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Original full-size image content
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ImageNotFound"

  /images/{imageId}/thumbnail:
    get:
      tags:
        - Images
      summary: Stream the image thumbnail
      description: |
        Returns the generated 100 × 100 PNG thumbnail. Thumbnails are always
        PNG regardless of whether the original image is JPEG, PNG, or WebP.

        This endpoint should be used when displaying public galleries, search
        results, and the authenticated user's image library.

        Public-image thumbnails are available to everyone. Private-image
        thumbnails are available only to their owner.
      operationId: getImageThumbnail
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Generated 100 × 100 thumbnail content
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ImageNotFound"

  /images/{imageId}/share-links:
    parameters:
      - $ref: "#/components/parameters/ImageId"

    post:
      tags:
        - Sharing
      summary: Create a private sharing link
      description: |
        Creates a temporary link for an owned private image.

        The returned sharing URL contains the raw token and is shown only once.
        Only a cryptographic hash of the token is stored.
      operationId: createImageShareLink
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: Sharing link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ImageNotFound"
        "409":
          $ref: "#/components/responses/PublicImageShareConflict"

    get:
      tags:
        - Sharing
      summary: List image sharing links
      description: Returns sharing-link metadata without returning secret tokens.
      operationId: getImageShareLinks
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sharing links belonging to the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ImageNotFound"

  /images/{imageId}/share-links/{shareLinkId}:
    delete:
      tags:
        - Sharing
      summary: Revoke a sharing link
      operationId: revokeImageShareLink
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
        - $ref: "#/components/parameters/ShareLinkId"
      responses:
        "204":
          description: Sharing link revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareLinkNotFound"

  /shares/{token}:
    get:
      tags:
        - Sharing
      summary: Get shared-image metadata
      description: Returns image metadata when the sharing token is valid, active, and unexpired.
      operationId: getSharedImage
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Shared-image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedImageResponse"
        "404":
          $ref: "#/components/responses/SharedImageNotFound"

  /shares/{token}/content:
    get:
      tags:
        - Sharing
      summary: Stream the shared image
      operationId: getSharedImageContent
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Shared original image
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/SharedImageNotFound"

  /shares/{token}/thumbnail:
    get:
      tags:
        - Sharing
      summary: Stream the shared-image thumbnail
      operationId: getSharedImageThumbnail
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Shared 100 × 100 thumbnail
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/SharedImageNotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Opaque session identifier stored by Spring Session JDBC

    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: CSRF token returned by GET /auth/csrf

  parameters:
    ImageId:
      name: imageId
      in: path
      required: true
      description: |
        Stable public UUID of the image. The internal numeric database ID is
        never exposed through the API.
      schema:
        type: string
        format: uuid
      example: c98237ef-192c-4fd5-b2e4-7e0bd5a68253

    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      description: Public sharing-link UUID
      schema:
        type: string
        format: uuid
      example: 3dd32033-9e52-4310-8a7f-cae3728de165

    ShareToken:
      name: token
      in: path
      required: true
      description: Secret token returned when the sharing link was created
      schema:
        type: string
        minLength: 32
        maxLength: 128
      example: Q1rBCbOA8J6TTRg2xMuMi4Pq4RQ2EYo3t0O3H7czGOk

    SearchQuery:
      name: q
      in: query
      required: false
      description: |
        Optional case-insensitive partial search across AI-generated objects,
        tags, and colors.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: sunset

    ContentTypeFilter:
      name: contentType
      in: query
      required: false
      description: Return only images with this original content type
      schema:
        type: string
        enum:
          - image/jpeg
          - image/png
          - image/webp
      example: image/webp

    ColorFilter:
      name: color
      in: query
      required: false
      description: Case-insensitive exact match against AI-detected colors
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: orange

    TaggingStatusFilter:
      name: taggingStatus
      in: query
      required: false
      description: Return only images with this AI-tagging status
      schema:
        $ref: "#/components/schemas/TaggingStatus"
      example: COMPLETED

    VisibilityFilter:
      name: isPublic
      in: query
      required: false
      description: Return only public or private images owned by the authenticated user
      schema:
        type: boolean
      example: false

    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: Number of images per page
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  headers:
    SessionCookie:
      description: Opaque database-backed session cookie
      schema:
        type: string
        example: SESSION=opaque-session-id; Path=/; HttpOnly; SameSite=Lax

    ContentDisposition:
      description: Inline content disposition with the sanitized filename
      schema:
        type: string
        example: inline; filename="image.webp"

    NoSniff:
      description: Prevents browser content-type sniffing
      schema:
        type: string
        enum:
          - nosniff

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Shadi Moon
        email:
          type: string
          format: email
          maxLength: 255
          example: shadi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: password123

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: shadi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: password123

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: shadi@example.com

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
          description: Single-use password-reset token from the reset link
          example: Q1rBCbOA8J6TTRg2xMuMi4Pq4RQ2EYo3t0O3H7czGOk
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: new-password123

    AuthenticatedUserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Public user UUID
          example: a70d9fd5-78be-467d-8057-2680ca29e793
        name:
          type: string
          example: Shadi Moon
        email:
          type: string
          format: email
          example: shadi@example.com
        createdAt:
          type: string
          format: date-time
          example: "2026-07-24T12:00:00Z"

    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
        - parameterName
      properties:
        token:
          type: string
          example: c1f09496-9505-46d4-a0ca-dda01a5fa464
        headerName:
          type: string
          example: X-CSRF-TOKEN
        parameterName:
          type: string
          example: _csrf

    ImageTags:
      type: object
      additionalProperties: false
      required:
        - objects
        - tags
        - colors
      properties:
        objects:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
          example:
            - ocean
            - cloud
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
          example:
            - sunset
            - nature
            - evening
        colors:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ImageColor"
          example:
            - ORANGE
            - BLUE
            - PURPLE

    ImageColor:
      type: string
      enum:
        - BLACK
        - WHITE
        - RED
        - GREEN
        - YELLOW
        - BLUE
        - BROWN
        - ORANGE
        - PINK
        - PURPLE
        - GRAY

    TaggingStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED

    ImageResponse:
      type: object
      description: |
        Image metadata shared by upload, gallery, search, owner-library,
        visibility-update, and individual-image responses.

        The response contains relative API URLs. It does not contain thumbnail
        or original image bytes.

        Clients should use thumbnailUrl in galleries, search results, and image
        libraries. Clients should request contentUrl only after the user
        explicitly opens the full image.
      additionalProperties: false
      required:
        - id
        - originalFilename
        - contentType
        - sizeBytes
        - width
        - height
        - isPublic
        - taggingStatus
        - contentUrl
        - thumbnailUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable public image UUID. This is different from the internal
            numeric database ID.
          example: c98237ef-192c-4fd5-b2e4-7e0bd5a68253

        originalFilename:
          type: string
          maxLength: 255
          description: Sanitized original filename
          example: sunset.webp

        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          example: image/webp

        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: Original image size in bytes
          example: 284391

        width:
          type: integer
          minimum: 1
          description: Original image width in pixels
          example: 1920

        height:
          type: integer
          minimum: 1
          description: Original image height in pixels
          example: 1080

        isPublic:
          type: boolean
          description: Whether the image can be accessed without authentication
          example: false

        aiTags:
          description: AI-generated image metadata, or null while unavailable
          anyOf:
            - $ref: "#/components/schemas/ImageTags"
            - type: "null"

        taggingStatus:
          $ref: "#/components/schemas/TaggingStatus"

        taggingStartedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-24T12:00:01Z"

        taggingCompletedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-24T12:00:04Z"

        taggingDurationMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
          example: 3000

        taggingError:
          type: [string, "null"]
          description: Sanitized processing failure information
          example: null

        contentUrl:
          type: string
          description: |
            Relative API URL for streaming the original full-size image.
            Clients should request it only after the user explicitly opens
            the image.
          example: /api/v1/images/c98237ef-192c-4fd5-b2e4-7e0bd5a68253/content

        thumbnailUrl:
          type: string
          description: |
            Relative API URL for the generated thumbnail. Clients should use
            it in galleries, search results, and image-library lists.
          example: /api/v1/images/c98237ef-192c-4fd5-b2e4-7e0bd5a68253/thumbnail

        createdAt:
          type: string
          format: date-time
          example: "2026-07-24T12:00:00Z"

        updatedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-24T12:00:04Z"

    ImagePageResponse:
      type: object
      description: |
        Paginated image metadata used by the public gallery, search results,
        and authenticated user's image library.

        Each item uses ImageResponse and contains URLs only. Image bytes are
        retrieved separately through the thumbnail or content endpoints.
      additionalProperties: false
      required:
        - images
        - page
        - size
        - totalElements
        - totalPages
      properties:
        images:
          type: array
          description: |
            Image metadata ordered from newest to oldest. Clients should use
            each item's thumbnailUrl when rendering the list.
          items:
            $ref: "#/components/schemas/ImageResponse"

        page:
          type: integer
          minimum: 0
          example: 0

        size:
          type: integer
          minimum: 1
          maximum: 50
          example: 20

        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 42

        totalPages:
          type: integer
          minimum: 0
          example: 3

    UpdateImageVisibilityRequest:
      type: object
      additionalProperties: false
      required:
        - isPublic
      properties:
        isPublic:
          type: boolean
          description: New public visibility state for the owned image
          example: true

    ShareExpiration:
      type: string
      enum:
        - ONE_HOUR
        - ONE_DAY
        - SEVEN_DAYS

    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      required:
        - expiration
      properties:
        expiration:
          $ref: "#/components/schemas/ShareExpiration"

    ShareLinkCreatedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - imageId
        - shareUrl
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 3dd32033-9e52-4310-8a7f-cae3728de165
        imageId:
          type: string
          format: uuid
          example: c98237ef-192c-4fd5-b2e4-7e0bd5a68253
        shareUrl:
          type: string
          description: Returned only when the sharing link is created
          example: /api/v1/shares/Q1rBCbOA8J6TTRg2xMuMi4Pq4RQ2EYo3t0O3H7czGOk
        expiresAt:
          type: string
          format: date-time
          example: "2026-07-25T12:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-07-24T12:00:00Z"

    ShareLinkResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - imageId
        - expiresAt
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 3dd32033-9e52-4310-8a7f-cae3728de165
        imageId:
          type: string
          format: uuid
          example: c98237ef-192c-4fd5-b2e4-7e0bd5a68253
        expiresAt:
          type: string
          format: date-time
          example: "2026-07-25T12:00:00Z"
        revokedAt:
          type: [string, "null"]
          format: date-time
          example: null
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-07-24T12:00:00Z"

    ShareLinkListResponse:
      type: object
      additionalProperties: false
      required:
        - shareLinks
      properties:
        shareLinks:
          type: array
          items:
            $ref: "#/components/schemas/ShareLinkResponse"

    SharedImageResponse:
      type: object
      additionalProperties: false
      required:
        - originalFilename
        - contentType
        - sizeBytes
        - width
        - height
        - taggingStatus
        - contentUrl
        - thumbnailUrl
      properties:
        originalFilename:
          type: string
          example: private-image.webp
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          example: 284391
        width:
          type: integer
          minimum: 1
          example: 1920
        height:
          type: integer
          minimum: 1
          example: 1080
        aiTags:
          anyOf:
            - $ref: "#/components/schemas/ImageTags"
            - type: "null"
        taggingStatus:
          $ref: "#/components/schemas/TaggingStatus"
        contentUrl:
          type: string
          example: /api/v1/shares/Q1rBCbOA8J6TTRg2xMuMi4Pq4RQ2EYo3t0O3H7czGOk/content
        thumbnailUrl:
          type: string
          example: /api/v1/shares/Q1rBCbOA8J6TTRg2xMuMi4Pq4RQ2EYo3t0O3H7czGOk/thumbnail

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-24T12:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Request validation failed
        path:
          type: string
          example: /api/v1/images

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-24T12:00:00Z"
            status: 400
            error: Bad Request
            message: Request validation failed
            path: /api/v1/images

    InvalidImage:
      description: Image is missing, empty, corrupt, or otherwise invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InvalidCredentials:
      description: Email or password is incorrect
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InvalidPasswordResetToken:
      description: Password-reset token is invalid, expired, or already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-30T12:00:00"
            status: 400
            error: Bad Request
            message: Password reset token is invalid or expired
            path: /api/v1/auth/password-reset/confirm

    Forbidden:
      description: The request is not allowed or the CSRF token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ImageNotFound:
      description: Image does not exist or is not accessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ShareLinkNotFound:
      description: Sharing link does not exist or is not accessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    SharedImageNotFound:
      description: Sharing token is invalid, expired, revoked, or inaccessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    EmailConflict:
      description: Email is already registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PublicImageShareConflict:
      description: Temporary sharing links can only be created for private images
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: Image exceeds the 10 MB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnsupportedImageType:
      description: Only JPEG, PNG, and WebP images are supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
