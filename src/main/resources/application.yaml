spring:
  application:
    name: image-hosting-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

  session:
    jdbc:
      initialize-schema: always

server:
  port: ${PORT:8080}
  shutdown: graceful

  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax

object-storage:
  endpoint: ${OBJECT_STORAGE_ENDPOINT}
  region: ${OBJECT_STORAGE_REGION:auto}
  access-key-id: ${OBJECT_STORAGE_ACCESS_KEY_ID}
  secret-access-key: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
  bucket: ${OBJECT_STORAGE_BUCKET}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
