spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000

  session:
    jdbc:
      initialize-schema: always

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax

object-storage:
  endpoint: ${OBJECT_STORAGE_ENDPOINT}
  region: ${OBJECT_STORAGE_REGION:auto}
  access-key-id: ${OBJECT_STORAGE_ACCESS_KEY_ID}
  secret-access-key: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
  bucket: ${OBJECT_STORAGE_BUCKET}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

logging:
  level:
    root: INFO
    com.example.imagehostingservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html